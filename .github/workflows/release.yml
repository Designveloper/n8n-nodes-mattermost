name: Check and stage npm release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: check
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-stage-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - name: Check release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (name !== '@designveloper/n8n-nodes-mattermost-trigger' || !stable.test(version)) {
            throw new Error('Only stable versions of the Mattermost package can target latest.');
          }
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF !== `refs/tags/v${version}`) {
            throw new Error('The Git tag must match package.json (v' + version + ').');
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {
            signal: AbortSignal.timeout(30000), cache: 'no-store',
          });
          if (!response.ok) throw new Error('Cannot check npm registry: HTTP ' + response.status);
          const registry = await response.json();
          if (registry.versions?.[version]) throw new Error(version + ' is already published.');
          const latest = registry['dist-tags']?.latest;
          if (!stable.test(latest)) throw new Error('Cannot determine the current stable latest version.');
          const current = latest.split('.').map(BigInt);
          const next = version.split('.').map(BigInt);
          const difference = next.map((part, index) => part - current[index]).find(part => part !== 0n);
          if (!difference || difference < 0n) throw new Error('Release must be newer than latest (' + latest + ').');
          console.log(`Ready to stage ${name}@${version} with tag latest.`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-package
      - name: Stage for one npm approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Configure the NPM_TOKEN Actions secret with the staged-publishing token.' >&2
            exit 1
          fi
          npm stage publish release-package/*.tgz --access public --tag latest
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Package staged with tag `latest`. Approve the stage ID printed above in npm.
          That single npm approval publishes the version and updates `latest` together.
          This workflow finishing means staged, not publicly released.
          SUMMARY
